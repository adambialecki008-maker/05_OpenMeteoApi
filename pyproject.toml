[project]
name = "05-openmeteoapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adam", email = "adambialecki008@gmial.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
05-openmeteoapi = "openmeteoapi:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.setuptool.packages.find]
where = ["src"]

[tool.uv.build-backend]
module-name = "openmeteoapi"